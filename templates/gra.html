<!DOCTYPE html>
<html>
<head>
    <p><a href="/sklep">Sklep</a></p>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Gra</title>
</head>
<body>
    <h1 id="licznikTekst">{{ wartosc }}</h1>
    <button onclick="zwiekszLicznik()">Kliknij mnie</button>
    <button onclick="resetujLicznik()">Reset</button>

    <p><a href="/menu">Powrót do menu</a></p>

    <script>
        async function zwiekszLicznik() {
            const odpowiedz = await fetch("/zwieksz_wynik");
            const dane = await odpowiedz.json();
            document.getElementById("licznikTekst").textContent = dane.wartosc;
        }

        async function resetujLicznik() {
            const odpowiedz = await fetch("/reset_wynik");
            const dane = await odpowiedz.json();
            document.getElementById("licznikTekst").textContent = dane.wartosc;
        }
    </script>
</body>
</html>
